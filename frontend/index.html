<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mission Validation Platform</title>
    <link rel="stylesheet" href="/assets/styles.css" />
    <link rel="stylesheet" href="/assets/overrides.css" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">M</div><div><strong>MISSION</strong><span>VALIDATION PLATFORM</span></div></div>
      <div class="project-switch">
        <label class="eyebrow" for="project-picker">ACTIVE WORKSPACE</label>
        <select id="project-picker" aria-label="Active project workspace"><option>Loading projects…</option></select>
        <small id="project-summary">Local project data</small>
      </div>
      <nav aria-label="Main navigation">
        <button class="nav active" data-page="Dashboard">⌂ <span>Dashboard</span></button>
        <button class="nav" data-page="Vehicle">◒ <span>Vehicle</span></button>
        <button class="nav" data-page="Mission">◎ <span>Mission</span></button>
        <button class="nav" data-page="Simulate">▷ <span>Simulate</span></button>
        <button class="nav" data-page="Test">✓ <span>Test</span></button>
        <button class="nav" data-page="Flights">⌁ <span>Flights</span></button>
        <button class="nav" data-page="Compare">⇄ <span>Compare</span></button>
        <button class="nav" data-page="Investigations">? <span>Investigations</span></button>
        <button class="nav" data-page="Reports">▣ <span>Reports</span></button>
        <button class="nav" data-page="Files">▤ <span>Files</span></button>
        <button class="nav" data-page="Security">◇ <span>Security</span></button>
        <button class="nav" data-page="Settings">⚙ <span>Settings</span></button>
      </nav>
      <div class="sidebar-footer"><span class="dot green"></span> Local workspace<br /><small>Software validation prototype</small></div>
    </aside>
    <main>
      <header><div><span class="eyebrow" id="crumb">DASHBOARD</span><h1 id="page-title">Mission overview</h1></div><div class="header-actions"><span class="badge neutral">LOCAL-FIRST</span><button class="secondary" id="report-button">Generate report</button><button class="primary" id="quick-sim">Run simulation</button></div></header>
      <div class="notice"><span>i</span><p><strong>Decision-support prototype.</strong> Simulated values help verify software behavior; they do not certify flight safety or replace physical testing.</p></div>
      <section id="content" aria-live="polite"></section>
    </main>
    <script src="/assets/app.js"></script>
  </body>
</html>
